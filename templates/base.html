<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Business Dashboard{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
</head>
<body>
<div class="wrap">

  <nav class="glass">
    <div class="brand">Business Dashboard</div>
    <div class="links">
      <a href="{{ url_for('overview') }}" class="{{ 'active' if active=='overview' }}">Overview</a>
      <a href="{{ url_for('revenue') }}" class="{{ 'active' if active=='revenue' }}">Revenue</a>
      <a href="{{ url_for('profit') }}" class="{{ 'active' if active=='profit' }}">Profit</a>
      <a href="{{ url_for('growth') }}" class="{{ 'active' if active=='growth' }}">Growth</a>
      <a href="{{ url_for('kpis') }}" class="{{ 'active' if active=='kpis' }}">KPIs</a>
    </div>
  </nav>

  {% block content %}{% endblock %}

</div>
{% block scripts %}{% endblock %}
</body>
</html>
