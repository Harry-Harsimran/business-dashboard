[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-dashboard"
version = "1.0.0"
description = "Multi-page Flask business dashboard — revenue, profit, growth, KPIs"
requires-python = ">=3.9"
dependencies = [
    "Flask==3.0.3",
]

[project.scripts]
pulse-dashboard = "run:main"

[tool.setuptools]
py-modules = ["run", "app", "db", "generate_data"]
